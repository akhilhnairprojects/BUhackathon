<!doctype html>
<html lang="en" data-resolution="landscape"
  data-composition-variables='[{"id":"site","type":"string","label":"Site URL","default":"trip-risk-checker.vercel.app"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root { --paper: #F5F2EC; --ink: #17150F; --brick: #B1372B; --muted: #76715F; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--paper); }
      #root { position: relative; width: 1920px; height: 1080px; }
      #ground { position: absolute; inset: 0; background: var(--paper); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="87.9" data-width="1920" data-height="1080" data-fps="30">
      <div id="ground"></div>
      <div id="intro" data-composition-id="intro" data-composition-src="compositions/intro.html" data-start="0" data-duration="4" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="check" data-composition-id="check" data-composition-src="compositions/check.html" data-start="4" data-duration="32.9" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="cost" data-composition-id="cost" data-composition-src="compositions/cost.html" data-start="36.9" data-duration="19.6" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="hubs" data-composition-id="hubs" data-composition-src="compositions/hubs.html" data-start="56.5" data-duration="26.4" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="outro" data-composition-id="outro" data-composition-src="compositions/outro.html" data-start="82.9" data-duration="5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
